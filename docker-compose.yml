services:
  db:
    image: postgres:16-alpine
    container_name: dogking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dogking
      POSTGRES_PASSWORD: dogking
      POSTGRES_DB: dogking
    ports:
      # 外部 5433 → 容器 5432，避免與機器上既有的 Postgres 衝突
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogking -d dogking"]
      interval: 5s
      timeout: 5s
      retries: 10
